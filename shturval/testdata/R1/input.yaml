apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: retained
  namespace: apps
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - retained.example.com
      secretName: retained-tls
  rules:
    - host: retained.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app
                port:
                  number: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: ingress-nginx-controller
  namespace: other-ns
spec:
  ports:
    - port: 80
    - port: 443

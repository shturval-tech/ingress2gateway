apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: retained
  namespace: apps
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - conflict.example.com
      secretName: retained-tls
  rules:
    - host: conflict.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app
                port:
                  number: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: platform
  namespace: gateway-system
spec:
  gatewayClassName: cilium
  listeners:
    - name: existing
      port: 443
      protocol: HTTPS
      hostname: conflict.example.com
---
apiVersion: v1
kind: Service
metadata:
  name: ingress-nginx-controller
  namespace: ingress-nginx
spec:
  ports:
    - port: 80
    - port: 443
